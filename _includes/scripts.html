<script src="{{ '/assets/js/main.min.js' | relative_url }}"></script>
<script>
  // 外部链接在新标签页打开；站内锚点（导航）保持在当前页
  (function () {
    var links = document.querySelectorAll('a[href^="http"]');
    for (var i = 0; i < links.length; i++) {
      if (links[i].hostname !== window.location.hostname) {
        links[i].setAttribute('target', '_blank');
        links[i].setAttribute('rel', 'noopener');
      }
    }
  })();

  // 论文演示视频：滚动到可见区域时才加载并播放，离开时暂停，节省流量
  (function () {
    var videos = document.querySelectorAll('video.paper-media');
    if (!videos.length) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var play = function (v) { var p = v.play(); if (p && p.catch) p.catch(function () {}); };
    for (var k = 0; k < videos.length; k++) {
      videos[k].addEventListener('click', function () { if (this.paused) play(this); else this.pause(); });
    }
    if (!('IntersectionObserver' in window)) {
      if (!reduce) for (var i = 0; i < videos.length; i++) play(videos[i]);
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting && !reduce) play(e.target); else e.target.pause();
      });
    }, { rootMargin: '200px 0px' });
    for (var j = 0; j < videos.length; j++) io.observe(videos[j]);
  })();
</script>
