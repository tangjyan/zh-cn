{% if page.lang == "en" %}
  {% assign nav_links = site.data.navigation.en %}
{% else %}
  {% assign nav_links = site.data.navigation.main %}
{% endif %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button aria-label="Menu"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item">
            {% if page.lang == "en" %}
            <a href="{{ '/' | relative_url }}" class="lang-switch" lang="zh-CN">
              <i class="fas fa-globe" aria-hidden="true"></i>
              中文
            </a>
            {% else %}
            <a href="{{ '/en/' | relative_url }}" class="lang-switch" lang="en">
              <i class="fas fa-globe" aria-hidden="true"></i>
              English
            </a>
            {% endif %}
          </li>
          {% for link in nav_links %}
            <li class="masthead__menu-item"><a href="{{ link.url | relative_url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
